<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Dark background -->
  <rect width="800" height="450" fill="#09090b" />
  
  <!-- Subtle gradient glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="400" cy="225" r="300" fill="url(#glow)" />
  
  <!-- Sunglasses Graphic -->
  <g stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Left Lens Frame -->
    <path d="M 280 200 C 230 200, 210 260, 260 280 C 310 300, 330 230, 310 210 C 300 200, 290 200, 280 200 Z" fill="#14532d" fill-opacity="0.2" />
    <!-- Right Lens Frame -->
    <path d="M 520 200 C 570 200, 590 260, 540 280 C 490 300, 470 230, 490 210 C 500 200, 510 200, 520 200 Z" fill="#14532d" fill-opacity="0.2" />
    <!-- Bridge -->
    <path d="M 310 210 C 330 195, 470 195, 490 210" stroke-width="6" />
    <!-- Left Temple/Arm (folding start) -->
    <path d="M 215 210 C 190 210, 160 230, 150 260" />
    <!-- Right Temple/Arm (folding start) -->
    <path d="M 585 210 C 610 210, 640 230, 650 260" />
  </g>
  
  <!-- Text Label -->
  <text x="400" y="340" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="4" text-anchor="middle" opacity="0.6">
    VECTOR EYEWEAR PREVIEW
  </text>
</svg>
